schema_version: 1
# PRM-vs-ORM rope diagnostic. Reads ONLY the SFT checkpoint's config.json (GPU job role's S3
# read grant) and replays vLLM's exact config path (get_config -> standardize_rope_params ->
# olmo2 get_rope) for the raw config + candidate fixes, to find which on-disk config survives
# vLLM's re-standardization. No model weights are loaded, so gpu-1xt4 (no bf16) suffices and no
# dtype appears in the command. Reads prior-run outputs via the job role, not a platform corpus
# -> --dataset none. All findings print after "=== PROBE RESULTS ===" to survive the log tail.
workload_profile: open-instruct-scored-rewards-train
suggested_compute: gpu-1xt4
command: >-
  bash -lc 'python projects/prm_vs_orm/rope_probe.py
  --sft-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fdfac-f2be-703f-af2b-aa525c23aa9e/checkpoints/'
