schema_version: 1
# PRM-vs-ORM Stage B (on-policy RM retrain): retrain BOTH reward models on the on-policy corpora
# Stage A generated from THIS 370M SFT policy (run_019fe8a1), replacing the PRM800K/GPT-4 RMs that
# failed the Stage-5 gate on distribution shift. Both RMs share the SFT checkpoint as warm-start
# (run_019fdfac) and the same trainer (reward_modeling_scored.py via run_rm.py); only --rm-type and
# --data-uri differ. Trained sequentially in ONE run to spend a single L40S allocation / approval:
#   * ORM: orm.jsonl -> 1-logit BCE on whole-solution correctness (last-token read at scoring).
#          on-policy label balance: 304 correct / 4800 incorrect (~6% positive).
#   * PRM: prm.jsonl -> 3-logit CE at step boundaries (neutral-counts-as-positive at scoring).
#          on-policy rating hist neg/neu/pos = 12817/678/401 (heavily negative on a weak policy).
# Each writes to its OWN subdir of the checkpoint dir ($EDULLM_CHECKPOINT_DIR/{orm,prm}) so Stage C
# (bon_eval) can point --orm-uri / --prm-uri at them without collision. run_rm.py does the S3
# plumbing (download SFT + data, accelerate launch across visible GPUs, upload the RM dir); the
# trainer reads/writes local paths only. Single L40S has bf16 in hardware, dtype bfloat16 is named
# in each command for the bfloat16_not_in_the_hardware guard -> no launch waiver. -train profile
# (reads prior runs' outputs via the GPU job role, writes only its RMs). W&B auto-wired (entity
# eduLLM, projects prm-vs-orm-orm / prm-vs-orm-prm). `&&` so PRM trains only if ORM succeeded; if
# PRM alone fails, ORM output persists at .../checkpoints/orm/ and PRM can be re-run on its own.
workload_profile: open-instruct-scored-rewards-train
suggested_compute: gpu-1xl40s
command: >-
  bash -lc 'python projects/prm_vs_orm/run_rm.py --rm-type orm
  --sft-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fdfac-f2be-703f-af2b-aa525c23aa9e/checkpoints/
  --data-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fe8a1-de1f-70b9-826c-6782b857b858/checkpoints/orm.jsonl
  --out "$EDULLM_CHECKPOINT_DIR/orm" --dtype bfloat16
  && python projects/prm_vs_orm/run_rm.py --rm-type prm
  --sft-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fdfac-f2be-703f-af2b-aa525c23aa9e/checkpoints/
  --data-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fe8a1-de1f-70b9-826c-6782b857b858/checkpoints/prm.jsonl
  --out "$EDULLM_CHECKPOINT_DIR/prm" --dtype bfloat16'
