schema_version: 1
# PRM-vs-ORM Stage 5: best-of-N go/no-go gate. Sample N solutions/problem from the Stage-2 SFT
# policy (vLLM) on a GSM8K test slice, then rank by ORM (last-token P(correct)), by PRM (product
# of per-step P(correct)), and by majority vote; report best-of-N accuracy, SFT-greedy and pass@N.
# Decision: if neither RM's best-of-N beats majority AND SFT-greedy, the RMs add no ranking signal
# -> stop before spending GPU on GRPO. Prints "BON GATE: GO/NO-GO" and uploads bon_report.json.
# Single process : single L40S (bf16 in hardware), so no EDULLM_LAUNCH_CHECK waiver. Reads prior
# runs' outputs (SFT run_019fdfac, RM run_019fe395, data run_019fdd78) via the GPU job role, writes
# its report to this run's checkpoint dir -> -train profile. dtype bf16 is set in code; L40S has it.
# VLLM_LOGGING_LEVEL=WARNING silences vLLM's INFO flood so the rm_common [rope-fix]/verify lines and
# the final "BON GATE" verdict survive in the ~50-line `edullm logs` tail.
#
# vLLM + the image's broken FlashInfer JIT toolchain (cu13 nvcc emits PTX .version 9.3 but its bundled
# ptxas is 9.0, and the <nv/target> header is absent). Two runs (019fe834, 019fe848) died at EngineCore
# init compiling FlashInfer *sampling* kernels (renorm.cu / sampling.cu / flashinfer_sampling_binding.cu),
# NOT attention -- setting VLLM_ATTENTION_BACKEND=TRITON_ATTN did not change the failure. Root cause:
# in vLLM 0.19.1 the ONLY code path that calls into flashinfer.sampling is TopKTopPSampler.forward_cuda,
# gated by VLLM_USE_FLASHINFER_SAMPLER; the vLLM default is None (-> forward_native, pure Triton/PyTorch
# top-k/top-p, no flashinfer), but the image env sets it truthy for the 7B Olmo3 RL recipes. Force
# VLLM_USE_FLASHINFER_SAMPLER=0 (bool(int("0"))==False) to override the image and select forward_native
# -- the numerically-default path, so correctness is unaffected. VLLM_ATTENTION_BACKEND=TRITON_ATTN is
# kept as a belt so attention can never fall to the same broken FlashInfer JIT (head_dim=64 supported).
workload_profile: open-instruct-scored-rewards-train
suggested_compute: gpu-1xl40s
command: >-
  bash -lc 'VLLM_LOGGING_LEVEL=WARNING VLLM_USE_FLASHINFER_SAMPLER=0 VLLM_ATTENTION_BACKEND=TRITON_ATTN python projects/prm_vs_orm/bon_eval.py
  --sft-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fdfac-f2be-703f-af2b-aa525c23aa9e/checkpoints/
  --orm-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fe395-36d9-7071-95a5-88f8a77e5179/checkpoints/orm
  --prm-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fe395-36d9-7071-95a5-88f8a77e5179/checkpoints/prm
  --eval-uri s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fdd78-db6f-702c-a119-7faa90ea0a33/checkpoints/eval_gsm8k.jsonl
  --out "$EDULLM_CHECKPOINT_DIR" --dataset gsm8k'
