schema_version: 1
# PRM-vs-ORM Stage 8 (final eval): the headline table -- greedy + maj@8 accuracy on GSM8K (primary)
# and MATH (secondary) for the SFT baseline, the ORM-RL policy, and the PRM-RL policy. One vLLM job
# grades every (model, dataset) cell via open_instruct's GSM8KVerifier/MathVerifier and uploads
# eval_report.json to $EDULLM_CHECKPOINT_DIR. eval_final.py is already in the 12f81741 image.
#
# The three --models URIs:
#   sft    = the Stage-2 SFT policy (same --sft-uri the GRPO arms init from)
#   orm_rl = ORM GRPO run_019fef5f-77de output ($EDULLM_CHECKPOINT_DIR) -- CONFIRM from that arm's
#            "GRPO RUN OK: ... policy=<uri>" line before submitting.
#   prm_rl = PRM GRPO run_019fef5f-de82 output -- CONFIRM likewise.
# The eval sets live in the same data-prep dir (run_019fdd78) that supplied the GRPO prompts.
#
# 370M policies -> a single bf16 GPU is ample (no 8xA100). "bfloat16" is named in the command so the
# precision guard can refuse up front on a card that lacks it (eval_final runs vLLM in bfloat16).
# gpu-1xh100 is priced but NOT provisioned; L40S (Ada, 48GB, bf16) is the beefiest provisioned single card.
workload_profile: open-instruct-scored-rewards-train
suggested_compute: gpu-1xl40s
command: >-
  bash -lc 'EDULLM_LAUNCH_CHECK=waived EDULLM_CHECKPOINT_CHECK=waived PRM_VS_ORM_EVAL_DTYPE=bfloat16
  VLLM_USE_FLASHINFER_SAMPLER=0 VLLM_ATTENTION_BACKEND=TRITON_ATTN
  python projects/prm_vs_orm/eval_final.py
  --models sft=s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fdfac-f2be-703f-af2b-aa525c23aa9e/checkpoints/,orm_rl=s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fef5f-77de-705a-8251-4aab1e29f5e3/checkpoints/,prm_rl=s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fef5f-de82-7056-8f9a-9bc6a0fb42c6/checkpoints/
  --eval-uris gsm8k=s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fdd78-db6f-702c-a119-7faa90ea0a33/checkpoints/eval_gsm8k.jsonl,math=s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fdd78-db6f-702c-a119-7faa90ea0a33/checkpoints/eval_math.jsonl
  --out "$EDULLM_CHECKPOINT_DIR"
  --maj-k 8 --num-problems 0 --gpu-mem-util 0.6 --max-seq-length 1024 --max-tokens 512'
